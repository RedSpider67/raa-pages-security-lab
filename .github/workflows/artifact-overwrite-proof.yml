name: Bounded cross-job artifact overwrite true proof

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: artifact-overwrite-proof
  cancel-in-progress: false

jobs:
  producer:
    name: Job A - finalize and preserve synthetic A
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload_a.outputs.artifact-id }}
    steps:
      - name: Create synthetic A
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="${RUNNER_TEMP}/artifact-a"
          mkdir -p "$fixture_dir"
          printf 'RAA_CROSS_JOB_ARTIFACT_A_%s\n' "${GITHUB_RUN_ID}" > "$fixture_dir/index.html"
          printf 'marker_a=' && cat "$fixture_dir/index.html"
          sha256sum "$fixture_dir/index.html"

      - name: Upload and finalize Artifact A
        id: upload_a
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact-a
          retention-days: 1
          overwrite: false

      - name: Preserve Artifact A ID metadata and content
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_A_ID: ${{ steps.upload_a.outputs.artifact-id }}
        run: |
          set -euo pipefail
          printf 'artifact_a_id=%s\n' "$ARTIFACT_A_ID"
          printf 'GET /repos/%s/actions/artifacts/%s\n' "$GITHUB_REPOSITORY" "$ARTIFACT_A_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_A_ID}" \
            --jq '{id,name,size_in_bytes,created_at,updated_at,expired,workflow_run}'
          archive="${RUNNER_TEMP}/artifact-a-${ARTIFACT_A_ID}.zip"
          printf 'GET /repos/%s/actions/artifacts/%s/zip\n' "$GITHUB_REPOSITORY" "$ARTIFACT_A_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_A_ID}/zip" > "$archive"
          sha256sum "$archive"
          printf 'artifact_a_member=' && unzip -Z1 "$archive"
          printf 'artifact_a_content=' && unzip -p "$archive" index.html
          printf 'artifact_a_content_sha256=' && unzip -p "$archive" index.html | sha256sum | cut -d' ' -f1

  replacer:
    name: Job B - overwrite with synthetic B
    needs: producer
    runs-on: ubuntu-latest
    steps:
      - name: Create distinct synthetic B
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="${RUNNER_TEMP}/artifact-b"
          mkdir -p "$fixture_dir"
          printf 'RAA_CROSS_JOB_ARTIFACT_B_%s\n' "${GITHUB_RUN_ID}" > "$fixture_dir/index.html"
          printf 'marker_b=' && cat "$fixture_dir/index.html"
          sha256sum "$fixture_dir/index.html"

      - name: Overwrite same-name finalized Artifact A
        id: overwrite
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact-b
          retention-days: 1
          overwrite: true

      - name: Record Artifact B ID
        shell: bash
        run: printf 'artifact_b_id=%s\n' '${{ steps.overwrite.outputs.artifact-id }}'
